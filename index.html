  --surface: #FDFCF9;
  --ink: #1C1917;
  --muted: #78716C;
  --faint: #E7E3DC;
  --accent: #C0440E;
  --accent-soft: #FAE8E0;
  --green: #166534;
  --green-soft: #DCFCE7;
  --gold: #92400E;
  --gold-soft: #FEF3C7;
  --border: #DDD8D0;
  --star: #F59E0B;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Geist', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
header {
  background: var(--ink);
  padding: 2rem 2.5rem 1.75rem;
}

h1 {
  font-family: 'Instrument Serif', serif;
  font-weight: 400;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  color: #FDFCF9;
  line-height: 1.05;
  letter-spacing: -0.02em;
}

h1 em { font-style: italic; color: #F97316; }

.header-meta {
  margin-top: 0.6rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.header-badge { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: #78716C; }

.last-updated {
  font-size: 0.68rem;
  color: #57534E;
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.dot {
  width: 6px; height: 6px;
  background: #22C55E;
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── EVANGELIO ── */
.evangelio-section {
  background: linear-gradient(135deg, #1C1917 0%, #292524 100%);
  border-bottom: 1px solid #3D3735;
  padding: 1.5rem 2.5rem;
}

.evangelio-label {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--star);
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.evangelio-fecha {
  font-size: 0.7rem;
  color: #78716C;
  margin-bottom: 0.5rem;
}

.evangelio-texto {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: clamp(0.95rem, 2.5vw, 1.15rem);
  color: #E7E3DC;
  line-height: 1.65;
  max-width: 700px;
}

.evangelio-cita {
  font-size: 0.72rem;
  color: #57534E;
  margin-top: 0.6rem;
  font-style: normal;
  font-family: 'Geist', sans-serif;
}

/* ── FILTER BAR ── */
.filter-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.7rem 2.5rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }

.filter-label {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  white-space: nowrap;
  margin-right: 0.5rem;
  flex-shrink: 0;
}

.filter-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 0.28rem 0.9rem;
  font-size: 0.73rem;
  font-family: 'Geist', sans-serif;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  flex-shrink: 0;
}
.filter-btn:hover { color: var(--ink); border-color: var(--ink); }
.filter-btn.active { background: var(--ink); border-color: var(--ink); color: #FDFCF9; }

/* ── STATS BAR ── */
.stats-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.5rem 2.5rem;
  display: flex;
  gap: 2rem;
  flex-wrap: wrap;
}

.stat { display: flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; color: var(--muted); }
.stat strong { color: var(--ink); font-weight: 500; }

/* ── MAIN ── */
main { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

.section-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 2rem 0 1rem;
}
.section-header:first-child { margin-top: 0; }

.section-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--muted);
  white-space: nowrap;
  font-weight: 500;
}

.section-line { flex: 1; height: 1px; background: var(--border); }

/* ── AVISO CARD ── */
.aviso {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1.25rem 1.5rem;
  margin-bottom: 0.6rem;
  transition: box-shadow 0.15s, border-color 0.15s;
  animation: fadeUp 0.25s ease both;
}

@keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

.aviso:hover { border-color: #C4B8A8; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.aviso.destacado { border-left: 3px solid var(--star); background: #FFFDF5; }
.aviso.urgent { border-left: 3px solid #DC2626; }
.aviso.future-event { border-left: 3px solid var(--green); }
.aviso.has-date { border-left: 3px solid var(--accent); }
.aviso.cal-only { background: #FAFAF9; border-style: dashed; }
.aviso.curso-entry { border-left: 3px solid #7C3AED; }

.aviso-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
  flex-wrap: wrap;
}

.aviso-received { font-size: 0.68rem; color: var(--muted); }

.tag {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0.12rem 0.5rem;
  border-radius: 2px;
  font-weight: 500;
}
.tag-category { background: var(--faint); color: var(--muted); }
.tag-urgent { background: #FEE2E2; color: #991B1B; }
.tag-future { background: var(--green-soft); color: var(--green); }
.tag-cal { background: var(--accent-soft); color: var(--accent); }
.tag-destacado { background: var(--gold-soft); color: var(--gold); }
.tag-curso { background: #EDE9FE; color: #5B21B6; }

.aviso-title {
  font-family: 'Instrument Serif', serif;
  font-size: 1.15rem;
  font-weight: 400;
  line-height: 1.3;
  color: var(--ink);
  margin-bottom: 0.45rem;
  letter-spacing: -0.01em;
}

.aviso-summary {
  font-size: 0.85rem;
  color: #44403C;
  line-height: 1.65;
  margin-bottom: 0.75rem;
}

.aviso-footer {

  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  padding-top: 0.75rem;
  border-top: 1px solid var(--faint);
}

.event-date-display {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.8rem;
  color: var(--accent);
  font-weight: 500;
}

.cal-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: var(--ink);
  color: #FDFCF9;
  border: none;
  border-radius: 2px;
  padding: 0.35rem 0.85rem;
  font-size: 0.72rem;
  font-family: 'Geist', sans-serif;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s;
  white-space: nowrap;
}
.cal-btn:hover { background: #292524; }

.empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
.empty-state p { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.1rem; }

.loading { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.82rem; }
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
  margin-bottom: 0.6rem;
}
@keyframes spin { to{transform:rotate(360deg)} }

footer {
  text-align: center;
  padding: 1.5rem;
  font-size: 0.68rem;
  color: var(--muted);
  border-top: 1px solid var(--border);
  margin-top: 1rem;
}

@media (max-width: 600px) {
  header { padding: 1.5rem; }
  .evangelio-section { padding: 1.25rem 1.5rem; }
  .filter-bar, .stats-bar { padding: 0.6rem 1rem; }
  main { padding: 1.25rem 0.75rem 3rem; }
  .aviso { padding: 1rem 1.1rem; }
}
</style>

function parseDate(str) {
  if (!str) return null;
  try { return new Date(str); } catch(e) { return null; }
}

function isFuture(dateStr) {
  const d = parseDate(dateStr);
  return d && d >= new Date();
}

function isThisWeek(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return false;
  const now = new Date();
  const diff = (d - now) / (1000*60*60*24);
  return diff >= -1 && diff <= 7;
}

function formatEventDate(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return '';
  return d.toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

function formatReceived(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return '';
  const now = new Date();
  const diff = Math.floor((now - d) / (1000*60*60*24));
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  if (diff < 7) return 'Hace ' + diff + ' días';
  return d.toLocaleDateString('es-CL', { day:'numeric', month:'short' });
}

function daysLabel(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return '';
  const days = Math.ceil((d - new Date()) / (1000*60*60*24));
  if (days < 0) return '';
  if (days === 0) return '¡Hoy!';
  if (days === 1) return 'Mañana';
  return 'En ' + days + ' días';
}

function generateICS(a) {
  const d = parseDate(a.event_date);
  if (!d) return '';
  const pad = n => String(n).padStart(2,'0');
  const fmt = dt => dt.getFullYear() + pad(dt.getMonth()+1) + pad(dt.getDate());
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Curso PK-A Cumbres//ES',
    'BEGIN:VEVENT',
    'UID:' + a.id + '@cumbres-pka',
    'DTSTART;VALUE=DATE:' + fmt(d),
    'DTEND;VALUE=DATE:' + fmt(new Date(d.getTime()+86400000)),
    'SUMMARY:' + (a.title||'Evento Colegio Cumbres'),
    'DESCRIPTION:' + (a.summary||'').replace(/\n/g,'\\n'),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
}

function renderAviso(a, idx) {
  const future = isFuture(a.event_date);
  const hasDate = !!a.event_date;
  const esCurso = a.source === 'sheet';

  let borderClass = '';
  if (a.destacado) borderClass = 'destacado';
  else if (a.urgent) borderClass = 'urgent';
  else if (future && hasDate) borderClass = 'future-event';
  else if (hasDate) borderClass = 'has-date';
  if (esCurso) borderClass = 'curso-entry';
  if (a.source === 'calendar') borderClass += ' cal-only';

  const days = hasDate ? daysLabel(a.event_date) : '';

  const tags = [];
  if (a.destacado) tags.push('<span class="tag tag-destacado">★ Destacado</span>');
  if (a.urgent) tags.push('<span class="tag tag-urgent">Urgente</span>');
  if (days) tags.push('<span class="tag tag-future">' + days + '</span>');
  if (esCurso) tags.push('<span class="tag tag-curso">Del curso</span>');
  if (a.category) tags.push('<span class="tag tag-category">' + a.category + '</span>');
  if (a.source === 'calendar') tags.push('<span class="tag tag-cal">Calendario</span>');

  const footer = hasDate ? `
    <div class="aviso-footer">
      <div class="event-date-display">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <rect x="1" y="2" width="11" height="10" rx="1" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4 1v2M9 1v2M1 5h11" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        ${formatEventDate(a.event_date)}
      </div>
      <a class="cal-btn" href="${generateICS(a)}" download="evento-pka.ics">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
          <path d="M5.5 1v6M2.5 5l3 3 3-3M1 9.5h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        Agregar al calendario
      </a>
    </div>` : '';

  const receivedLine = a.received ? '<span class="aviso-received">' + formatReceived(a.received) + '</span>' : '';

  return `
    <div class="aviso ${borderClass}" style="animation-delay:${idx*.035}s"
         data-received="${a.received||''}"
         data-event="${a.event_date||''}"
         data-urgent="${a.urgent||false}"
         data-destacado="${a.destacado||false}"
         data-future="${future}"
         data-source="${a.source||'email'}">
      <div class="aviso-meta">${receivedLine}${tags.join('')}</div>
      <div class="aviso-title">${a.title||'Sin título'}</div>
      <div class="aviso-summary">${a.summary||''}</div>
      ${footer}
    </div>`;
}

function renderAll(avisos) {
  const main = document.getElementById('main-content');
  if (!avisos || avisos.length === 0) {
    main.innerHTML = '<div class="empty-state"><p>No hay avisos disponibles.</p></div>';
    return;
  }

  const withDate = avisos.filter(a => a.event_date).length;
  const upcoming = avisos.filter(a => isFuture(a.event_date)).length;
  const destacados = avisos.filter(a => a.destacado).length;
  document.getElementById('stat-total').textContent = avisos.length;
  document.getElementById('stat-events').textContent = withDate;
  document.getElementById('stat-upcoming').textContent = upcoming;
  document.getElementById('stat-destacados').textContent = destacados;

  if (avisos[0] && avisos[0].received) {
    const d = parseDate(avisos[0].received);
    document.getElementById('last-updated-text').textContent =
      'Actualizado ' + (d ? d.toLocaleDateString('es-CL',{day:'numeric',month:'short'}) : '');
  }

  const destacadosArr = avisos.filter(a => a.destacado);
  const conFechaFutura = avisos.filter(a => !a.destacado && isFuture(a.event_date));
  const resto = avisos.filter(a => !a.destacado && !isFuture(a.event_date));

  let html = '';
  let idx = 0;

  if (destacadosArr.length > 0) {
    html += '<div class="section-header"><span class="section-label">★ Destacados</span><div class="section-line"></div></div>';
    destacadosArr.forEach(a => { html += renderAviso(a, idx++); });
  }

  if (conFechaFutura.length > 0) {
    html += '<div class="section-header"><span class="section-label">Próximos eventos</span><div class="section-line"></div></div>';
    conFechaFutura.forEach(a => { html += renderAviso(a, idx++); });
  }

  if (resto.length > 0) {
    html += '<div class="section-header"><span class="section-label">Comunicados recientes</span><div class="section-line"></div></div>';
    resto.forEach(a => { html += renderAviso(a, idx++); });
  }

  main.innerHTML = html;
}

function applyFilter(filter) {
  document.querySelectorAll('.aviso').forEach(el => {
    let show = true;
    if (filter === 'destacados') show = el.dataset.destacado === 'true';
    else if (filter === 'upcoming') show = el.dataset.future === 'true';
    else if (filter === 'this-week') show = isThisWeek(el.dataset.event) || isThisWeek(el.dataset.received);
    else if (filter === 'urgent') show = el.dataset.urgent === 'true';
    else if (filter === 'curso') show = el.dataset.source === 'sheet';
    el.style.display = show ? '' : 'none';
  });

  document.querySelectorAll('.section-header').forEach(sh => {
    let cursor = sh.nextElementSibling;
    let hasVisible = false;
    while (cursor && !cursor.classList.contains('section-header')) {
      if (cursor.style.display !== 'none') hasVisible = true;
      cursor = cursor.nextElementSibling;
    }
    sh.style.display = hasVisible ? '' : 'none';
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter(btn.dataset.filter);
  });
});

</script>
