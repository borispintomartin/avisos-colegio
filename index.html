<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avisos del Curso</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F4EF;
    --ink: #1A1814;
    --muted: #8A8478;
    --accent: #C4622D;
    --accent-light: #F0DDD2;
    --line: #DDD9D0;
    --white: #FDFCFA;
    --tag-bg: #E8E4DC;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* Header */
  header {
    background: var(--ink);
    padding: 2rem 2.5rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
  }

  .header-left h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    color: var(--white);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .header-left h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .header-sub {
    font-size: 0.78rem;
    color: #7A7670;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-top: 0.4rem;
  }

  .last-update {
    font-size: 0.72rem;
    color: #5A5650;
    text-align: right;
    white-space: nowrap;
  }

  /* Filter bar */
  .filter-bar {
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 0.75rem 2.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    overflow-x: auto;
  }

  .filter-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    white-space: nowrap;
    margin-right: 0.5rem;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 0.3rem 0.85rem;
    font-size: 0.75rem;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--white);
  }

  /* Main content */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 2.5rem 2rem;
  }

  /* Section divider */
  .section-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.25rem;
    margin-top: 2.5rem;
  }

  .section-header:first-child { margin-top: 0; }

  .section-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    white-space: nowrap;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* Aviso card */
  .aviso {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1.5rem 1.75rem;
    margin-bottom: 0.75rem;
    position: relative;
    transition: border-color 0.15s, box-shadow 0.15s;
    cursor: default;
  }

  .aviso:hover {
    border-color: var(--accent);
    box-shadow: 3px 3px 0 var(--accent-light);
  }

  .aviso.urgent {
    border-left: 3px solid var(--accent);
  }

  .aviso-meta {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.6rem;
    flex-wrap: wrap;
  }

  .aviso-date {
    font-size: 0.72rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .aviso-tag {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    background: var(--tag-bg);
    color: var(--ink);
    padding: 0.15rem 0.55rem;
    border-radius: 1px;
  }

  .aviso-tag.urgent-tag {
    background: var(--accent);
    color: white;
  }

  .aviso-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.1rem;
    line-height: 1.3;
    color: var(--ink);
    margin-bottom: 0.5rem;
    letter-spacing: -0.01em;
  }

  .aviso-summary {
    font-size: 0.88rem;
    color: #4A4840;
    line-height: 1.65;
  }

  .aviso-event-date {
    margin-top: 0.85rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.78rem;
    color: var(--accent);
    font-weight: 500;
  }

  .aviso-event-date svg {
    flex-shrink: 0;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }

  .empty-state p {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1.1rem;
    opacity: 0.7;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 3rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    margin-bottom: 0.75rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Footer */
  footer {
    text-align: center;
    padding: 2rem;
    font-size: 0.72rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
    margin-top: 2rem;
  }

  /* Responsive */
  @media (max-width: 600px) {
    header { padding: 1.5rem; }
    .filter-bar { padding: 0.75rem 1.5rem; }
    main { padding: 1.5rem 1rem; }
    .aviso { padding: 1.25rem; }
  }

  /* Fade in */
  .aviso {
    animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Avisos del <em>Curso</em></h1>
    <div class="header-sub">Colegio Cumbres · Comunicaciones del curso</div>
  </div>
  <div class="last-update" id="last-update"></div>
</header>

<div class="filter-bar">
  <span class="filter-label">Ver:</span>
  <button class="filter-btn active" data-filter="all">Todos</button>
  <button class="filter-btn" data-filter="this-week">Esta semana</button>
  <button class="filter-btn" data-filter="upcoming">Próximos eventos</button>
  <button class="filter-btn" data-filter="urgent">Urgentes</button>
</div>

<main id="main-content">
  <div class="loading">
    <div class="spinner"></div>
    <div>Cargando avisos...</div>
  </div>
</main>

<footer>
  Actualizado automáticamente desde los correos del colegio · Solo lectura
</footer>

<script>
// =============================================
// DATOS — este bloque es reemplazado por el script
// =============================================
const DATA_AVISOS = __AVISOS_JSON__;
// =============================================

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    return d.toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
  } catch(e) { return dateStr; }
}

function formatReceivedDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    const now = new Date();
    const diff = Math.floor((now - d) / (1000 * 60 * 60 * 24));
    if (diff === 0) return 'Hoy';
    if (diff === 1) return 'Ayer';
    if (diff < 7) return `Hace ${diff} días`;
    return d.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
  } catch(e) { return dateStr; }
}

function isThisWeek(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const now = new Date();
  const diff = (d - now) / (1000 * 60 * 60 * 24);
  return diff >= 0 && diff <= 7;
}

function isUpcoming(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const now = new Date();
  return d >= now;
}

function renderAvisos(avisos) {
  const main = document.getElementById('main-content');

  if (!avisos || avisos.length === 0) {
    main.innerHTML = '<div class="empty-state"><p>No hay avisos recientes.</p></div>';
    return;
  }

  // Group by week
  const thisWeek = [];
  const earlier = [];
  const now = new Date();

  avisos.forEach(a => {
    const d = new Date(a.received);
    const diff = (now - d) / (1000 * 60 * 60 * 24);
    if (diff <= 7) thisWeek.push(a);
    else earlier.push(a);
  });

  let html = '';

  if (thisWeek.length > 0) {
    html += '<div class="section-header"><span class="section-label">Esta semana</span><div class="section-line"></div></div>';
    thisWeek.forEach((a, i) => {
      html += renderAviso(a, i);
    });
  }

  if (earlier.length > 0) {
    html += '<div class="section-header"><span class="section-label">Anteriores</span><div class="section-line"></div></div>';
    earlier.forEach((a, i) => {
      html += renderAviso(a, i + thisWeek.length);
    });
  }

  main.innerHTML = html;

  // Update last update time
  if (avisos[0] && avisos[0].received) {
    const d = new Date(avisos[0].received);
    document.getElementById('last-update').innerHTML =
      'Último aviso<br>' + d.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
  }
}

function renderAviso(a, idx) {
  const urgentClass = a.urgent ? ' urgent' : '';
  const urgentTag = a.urgent ? '<span class="aviso-tag urgent-tag">Urgente</span>' : '';
  const categoryTag = a.category ? `<span class="aviso-tag">${a.category}</span>` : '';
  const eventDate = a.event_date
    ? `<div class="aviso-event-date">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <rect x="1" y="2" width="11" height="10" rx="1" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4 1v2M9 1v2M1 5h11" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        Fecha del evento: ${formatDate(a.event_date)}
      </div>`
    : '';

  return `
    <div class="aviso${urgentClass}" style="animation-delay: ${idx * 0.04}s"
         data-received="${a.received || ''}"
         data-event="${a.event_date || ''}"
         data-urgent="${a.urgent || false}">
      <div class="aviso-meta">
        <span class="aviso-date">${formatReceivedDate(a.received)}</span>
        ${urgentTag}
        ${categoryTag}
      </div>
      <div class="aviso-title">${a.title || 'Sin título'}</div>
      <div class="aviso-summary">${a.summary || ''}</div>
      ${eventDate}
    </div>
  `;
}

function applyFilter(filter) {
  const avisos = document.querySelectorAll('.aviso');
  avisos.forEach(el => {
    let show = true;
    if (filter === 'this-week') {
      show = isThisWeek(el.dataset.received) || isThisWeek(el.dataset.event);
    } else if (filter === 'upcoming') {
      show = isUpcoming(el.dataset.event);
    } else if (filter === 'urgent') {
      show = el.dataset.urgent === 'true';
    }
    el.style.display = show ? '' : 'none';
  });

  // Hide/show section headers
  document.querySelectorAll('.section-header').forEach(sh => {
    const next = sh.nextElementSibling;
    let hasVisible = false;
    let cursor = next;
    while (cursor && !cursor.classList.contains('section-header')) {
      if (cursor.style.display !== 'none') hasVisible = true;
      cursor = cursor.nextElementSibling;
    }
    sh.style.display = hasVisible ? '' : 'none';
  });
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter(btn.dataset.filter);
  });
});

// Render
try {
  const avisos = typeof DATA_AVISOS === 'object' ? DATA_AVISOS : [];
  renderAvisos(avisos);
} catch(e) {
  document.getElementById('main-content').innerHTML =
    '<div class="empty-state"><p>Error al cargar los avisos.</p></div>';
}
</script>

</body>
</html>
