
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso PK-A — Colegio Cumbres</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F2ED;
  --surface: #FDFCF9;
  --ink: #1C1917;
  --muted: #78716C;
  --faint: #E7E3DC;
  --accent: #C0440E;
  --accent-soft: #FAE8E0;
  --green: #166534;
  --green-soft: #DCFCE7;
  --gold: #92400E;
  --gold-soft: #FEF3C7;
  --border: #DDD8D0;
  --star: #F59E0B;
  --purple: #5B21B6;
  --purple-soft: #EDE9FE;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:'Geist',sans-serif; font-weight:300; min-height:100vh; -webkit-font-smoothing:antialiased; }

header { background:var(--ink); padding:2rem 2.5rem 1.75rem; }
h1 { font-family:'Instrument Serif',serif; font-weight:400; font-size:clamp(1.8rem,5vw,2.8rem); color:#FDFCF9; line-height:1.05; letter-spacing:-0.02em; }
h1 em { font-style:italic; color:#F97316; }
.header-meta { margin-top:0.6rem; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
.header-badge { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.12em; color:#78716C; }
.last-updated { font-size:0.68rem; color:#57534E; display:flex; align-items:center; gap:0.35rem; }
.dot { width:6px; height:6px; background:#22C55E; border-radius:50%; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.evangelio-section { background:linear-gradient(135deg,#1C1917 0%,#292524 100%); border-bottom:1px solid #3D3735; padding:1.5rem 2.5rem; }
.evangelio-label { font-size:0.62rem; text-transform:uppercase; letter-spacing:0.18em; color:var(--star); margin-bottom:0.5rem; }
.evangelio-fecha { font-size:0.7rem; color:#78716C; margin-bottom:0.5rem; }
.evangelio-texto { font-family:'Instrument Serif',serif; font-style:italic; font-size:clamp(0.95rem,2.5vw,1.1rem); color:#E7E3DC; line-height:1.65; max-width:700px; }
.evangelio-cita { font-size:0.72rem; color:#57534E; margin-top:0.6rem; font-family:'Geist',sans-serif; }

.stats-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:0.5rem 2.5rem; display:flex; gap:2rem; flex-wrap:wrap; }
.stat { display:flex; align-items:center; gap:0.4rem; font-size:0.72rem; color:var(--muted); }
.stat strong { color:var(--ink); font-weight:500; }

main { max-width:860px; margin:0 auto; padding:2rem 1.5rem 4rem; }

.section-header { display:flex; align-items:center; gap:0.75rem; margin:2rem 0 1rem; }
.section-header:first-child { margin-top:0; }
.section-label { font-size:0.65rem; text-transform:uppercase; letter-spacing:0.15em; color:var(--muted); white-space:nowrap; font-weight:500; }
.section-line { flex:1; height:1px; background:var(--border); }

.aviso { background:var(--surface); border:1px solid var(--border); border-radius:3px; padding:1.25rem 1.5rem; margin-bottom:0.6rem; transition:box-shadow 0.15s,border-color 0.15s; animation:fadeUp 0.25s ease both; }
@keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
.aviso:hover { border-color:#C4B8A8; box-shadow:0 2px 12px rgba(0,0,0,.06); }
.aviso.destacado { border-left:3px solid var(--star); background:#FFFDF5; }
.aviso.con-fecha { border-left:3px solid var(--green); }
.aviso.urgente { border-left:3px solid #DC2626; }

.aviso-meta { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem; flex-wrap:wrap; }

.tag { font-size:0.62rem; text-transform:uppercase; letter-spacing:0.08em; padding:0.12rem 0.5rem; border-radius:2px; font-weight:500; }
.tag-cat { background:var(--faint); color:var(--muted); }
.tag-dest { background:var(--gold-soft); color:var(--gold); }
.tag-dias { background:var(--green-soft); color:var(--green); }

.aviso-title { font-family:'Instrument Serif',serif; font-size:1.15rem; font-weight:400; line-height:1.3; color:var(--ink); margin-bottom:0.45rem; letter-spacing:-0.01em; }
.aviso-desc { font-size:0.85rem; color:#44403C; line-height:1.65; }

.aviso-footer { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; padding-top:0.75rem; border-top:1px solid var(--faint); margin-top:0.75rem; }
.event-date { display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; color:var(--accent); font-weight:500; }
.cal-btn { display:inline-flex; align-items:center; gap:0.35rem; background:var(--ink); color:#FDFCF9; border:none; border-radius:2px; padding:0.35rem 0.85rem; font-size:0.72rem; font-family:'Geist',sans-serif; cursor:pointer; text-decoration:none; transition:background 0.15s; white-space:nowrap; }
.cal-btn:hover { background:#292524; }

.empty-state { text-align:center; padding:4rem 2rem; color:var(--muted); }
.empty-state p { font-family:'Instrument Serif',serif; font-style:italic; font-size:1.1rem; }

footer { text-align:center; padding:1.5rem; font-size:0.68rem; color:var(--muted); border-top:1px solid var(--border); margin-top:1rem; }

@media (max-width:600px) {
  header { padding:1.5rem; }
  .evangelio-section { padding:1.25rem 1.5rem; }
  .stats-bar { padding:0.5rem 1rem; }
  main { padding:1.25rem 0.75rem 3rem; }
  .aviso { padding:1rem 1.1rem; }
}
</style>
</head>
<body>

<header>
  <h1>Curso <em>PK-A</em></h1>
  <div class="header-meta">
    <span class="header-badge">Colegio Cumbres · Preescolar</span>
    <span class="last-updated"><span class="dot"></span><span id="last-updated-text">Cargando...</span></span>
  </div>
</header>

<div class="evangelio-section" id="evangelio-section">
  <div class="evangelio-label">✦ Evangelio del día</div>
  <div class="evangelio-fecha" id="evangelio-fecha"></div>
  <div class="evangelio-texto" id="evangelio-texto">Cargando...</div>
  <div class="evangelio-cita" id="evangelio-cita"></div>
</div>

<div class="stats-bar">
  <div class="stat"><strong id="stat-total">—</strong> avisos activos</div>
  <div class="stat"><strong id="stat-eventos">—</strong> con fecha</div>
  <div class="stat"><strong id="stat-proximos">—</strong> esta semana</div>
</div>

<main id="main-content">
  <div class="empty-state"><p>Cargando avisos...</p></div>
</main>

<footer>Actualizado automáticamente · Curso PK-A Colegio Cumbres · Solo lectura</footer>

<script>
const DATA_AVISOS = [{"id":"19dfefb0d3f1ce94_1","titulo":"Feria del Libro 2026","descripcion":"Actividad de fomento de lectura con presencia de libros y autores. Invitación a toda la comunidad escolar a participar.","fecha":null,"categoria":"Eventos","destacado":false},{"id":"19dfefb0d3f1ce94_3","titulo":"Invitación Peregrinación a la Virgen del Cerro San Cristóbal","descripcion":"Peregrinación familiar misionera a la Virgen del Cerro San Cristóbal. Invitación abierta a familias del colegio.","fecha":null,"categoria":"Eventos","destacado":false},{"id":"19dfefb0d3f1ce94_5","titulo":"Invitación Parent's Day","descripcion":"Día especial para padres en el I Ciclo donde podrán compartir actividades con sus hijos en el colegio.","fecha":null,"categoria":"Eventos","destacado":false},{"id":"19dfefb0d3f1ce94_6","titulo":"Charla Espacio Personal para Playgroup","descripcion":"Charla dirigida a apoderados de Playgroup sobre cómo educar el respeto y la intimidad en los niños pequeños.","fecha":null,"categoria":"Salud","destacado":false},{"id":"19dfefb0d3f1ce94_7","titulo":"Concurso Familiar de Pintura Prekinder y Kinder","descripcion":"Concurso de pintura donde participan familias completas de Prekinder y Kinder. Actividad que fomenta el arte y la participación familiar.","fecha":null,"categoria":"Arte","destacado":false},{"id":"19ddfcd480e6520b_1","titulo":"Semana de la Convivencia","descripcion":"Actividad institucional enfocada en la promoción de una cultura del encuentro y desarrollo de habilidades para resolver conflictos. Se busca generar un ambiente comunitario basado en la caridad y respeto por cada persona.","fecha":null,"categoria":"Eventos","destacado":false}];
const DATA_EVANGELIO = {"fecha":"Lunes, 11 de mayo de 2026","texto":"San Ignacio de Laconi, Religioso (Memoria) Fecha: lunes, 11 de mayo de 2026 Hechos 16:11-15 11Haciéndonos a la mar, fuimos desde Tróade derechos a Samotracia; al día siguiente a Neápolis, 12y de allí a Filipos, que es la primera ciudad de la región de Macedonia y colonia romana. En esta ciudad permanecimos varios días. 13El sábado salimos fuera de la puerta de la ciudad, junto al río, donde pensábamos que se tendría la oración.","cita":"San Ignacio de Laconi, Religioso (Memoria)"};

function parseDate(str) {
  if (!str) return null;
  try { return new Date(str + 'T12:00:00'); } catch(e) { return null; }
}

function esFuturo(str) {
  const d = parseDate(str);
  if (!d) return false;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return d >= hoy;
}

function estaEnEstaSemana(str) {
  const d = parseDate(str);
  if (!d) return false;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const en7 = new Date(hoy); en7.setDate(en7.getDate() + 7);
  return d >= hoy && d <= en7;
}

function diasParaEvento(str) {
  const d = parseDate(str);
  if (!d) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.ceil((d - hoy) / (1000*60*60*24));
}

function labelDias(str) {
  const d = diasParaEvento(str);
  if (d === null || d < 0) return '';
  if (d === 0) return '¡Hoy!';
  if (d === 1) return 'Mañana';
  if (d <= 7) return 'En ' + d + ' días';
  return '';
}

function formatFecha(str) {
  const d = parseDate(str);
  if (!d) return '';
  return d.toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

function generarICS(aviso) {
  const d = parseDate(aviso.fecha);
  if (!d) return '';
  const pad = n => String(n).padStart(2,'0');
  const fmt = dt => dt.getFullYear() + pad(dt.getMonth()+1) + pad(dt.getDate());
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Curso PK-A Cumbres//ES',
    'BEGIN:VEVENT',
    'UID:' + aviso.id + '@cumbres-pka',
    'DTSTART;VALUE=DATE:' + fmt(d),
    'DTEND;VALUE=DATE:' + fmt(new Date(d.getTime()+86400000)),
    'SUMMARY:' + (aviso.titulo||'Evento Colegio Cumbres'),
    'DESCRIPTION:' + (aviso.descripcion||'').replace(/\n/g,'\\n'),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
}

function renderAviso(a, idx) {
  const futuro = esFuturo(a.fecha);
  const label = labelDias(a.fecha);
  const bordeClass = a.destacado ? 'destacado' : (futuro ? 'con-fecha' : '');

  const tags = [];
  if (a.destacado) tags.push('<span class="tag tag-dest">★ Destacado</span>');
  if (label) tags.push('<span class="tag tag-dias">' + label + '</span>');
  if (a.categoria) tags.push('<span class="tag tag-cat">' + a.categoria + '</span>');

  const footer = a.fecha && futuro ? `
    <div class="aviso-footer">
      <div class="event-date">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <rect x="1" y="2" width="11" height="10" rx="1" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4 1v2M9 1v2M1 5h11" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        ${formatFecha(a.fecha)}
      </div>
      <a class="cal-btn" href="${generarICS(a)}" download="evento-pka.ics">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
          <path d="M5.5 1v6M2.5 5l3 3 3-3M1 9.5h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        Agregar al calendario
      </a>
    </div>` : '';

  return `<div class="aviso ${bordeClass}" style="animation-delay:${idx*.04}s">
    <div class="aviso-meta">${tags.join('')}</div>
    <div class="aviso-title">${a.titulo||'Sin título'}</div>
    <div class="aviso-desc">${a.descripcion||''}</div>
    ${footer}
  </div>`;
}

function render(avisos) {
  const main = document.getElementById('main-content');
  if (!avisos || avisos.length === 0) {
    main.innerHTML = '<div class="empty-state"><p>No hay avisos activos.</p></div>';
    return;
  }

  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const conFecha = avisos.filter(a => a.fecha && esFuturo(a.fecha));
  const sinFecha = avisos.filter(a => !a.fecha || !esFuturo(a.fecha));

  document.getElementById('stat-total').textContent = avisos.length;
  document.getElementById('stat-eventos').textContent = conFecha.length;
  document.getElementById('stat-proximos').textContent = avisos.filter(a => estaEnEstaSemana(a.fecha)).length;
  document.getElementById('last-updated-text').textContent = 'Actualizado ' + new Date().toLocaleDateString('es-CL',{day:'numeric',month:'short'});

  let html = '';
  let idx = 0;

  if (conFecha.length > 0) {
    html += '<div class="section-header"><span class="section-label">Próximos eventos</span><div class="section-line"></div></div>';
    conFecha.forEach(a => { html += renderAviso(a, idx++); });
  }

  if (sinFecha.length > 0) {
    html += '<div class="section-header"><span class="section-label">Comunicados</span><div class="section-line"></div></div>';
    sinFecha.forEach(a => { html += renderAviso(a, idx++); });
  }

  main.innerHTML = html;
}

// Evangelio
try {
  const ev = DATA_EVANGELIO;
  if (ev && ev.texto) {
    document.getElementById('evangelio-fecha').textContent = ev.fecha || '';
    document.getElementById('evangelio-texto').textContent = ev.texto;
    document.getElementById('evangelio-cita').textContent = ev.cita || '';
  } else {
    document.getElementById('evangelio-section').style.display = 'none';
  }
} catch(e) {
  document.getElementById('evangelio-section').style.display = 'none';
}

// Avisos
try {
  render(Array.isArray(DATA_AVISOS) ? DATA_AVISOS : []);
} catch(e) {
  document.getElementById('main-content').innerHTML = '<div class="empty-state"><p>Error cargando avisos.</p></div>';
}
</script>
</body>
</html>
